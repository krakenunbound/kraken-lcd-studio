name: Windows CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-direct.txt
      - run: python -m py_compile thermaltake_lcd.py lcd_media.py lcd_gui.py
      - run: python -m unittest discover -s tests -v
